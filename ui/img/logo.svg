<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Probatur">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a063d"/>
      <stop offset="100%" stop-color="#5618b5"/>
    </linearGradient>
    <linearGradient id="p-iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="p-check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- backdrop -->
  <rect width="64" height="64" rx="14" fill="url(#p-bg)"/>
  <!-- shield -->
  <path d="M32 8 L52 16 V32 C52 44 42 54 32 58 C22 54 12 44 12 32 V16 Z"
        fill="url(#p-iris)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- check mark -->
  <path d="M22 32 L29 39 L44 23" stroke="url(#p-check)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
